<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mike Coach — Définir mon mot de passe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500;1,6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Carnet tokens (same hex as src/input.css; this page loads no Tailwind) */
    :root {
      --paper:  #EEEDE8;
      --sheet:  #F7F6F2;
      --ink:    #1B1C1F;
      --mut:    #6F6C64;
      --rule:   #D6D3C9;
      --done:   #1E6B4A;
      --alert:  #A8321F;
      --f-display: "Newsreader", ui-serif, Georgia, serif;
      --f-sans:    "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --radius:  6px;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--f-sans);
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    /* ── BROWSER BANNER ── */
    #browser-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: var(--sheet);
      color: var(--ink);
      border-bottom: 1.5px solid var(--ink);
      font-size: 13px;
      padding: 12px 16px;
      text-align: center;
      z-index: 100;
      display: none;
    }
    #browser-banner.visible { display: block; }
    #browser-banner a {
      color: var(--ink);
      text-decoration: underline;
      font-weight: 600;
      margin-left: 8px;
    }
    #btn-copy {
      display: inline-block;
      margin-left: 8px;
      background: transparent;
      border: 1.5px solid var(--ink);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--f-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 2px 8px;
      cursor: pointer;
    }

    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-logo {
      font-family: var(--f-display);
      font-style: italic;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.01em;
      padding-bottom: 14px;
      margin-bottom: 10px;
      border-bottom: 1.5px solid var(--ink);
    }
    .card-title {
      font-family: var(--f-display);
      font-weight: 500;
      font-size: 40px;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .card-sub {
      color: var(--mut);
      font-size: 13px;
    }

    input[type=password] {
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--f-sans);
      font-size: 16px;
      height: 48px;
      padding: 0 12px;
      width: 100%;
      outline: none;
    }
    input[type=password]::placeholder { color: var(--mut); }
    input[type=password]:focus { border-color: var(--ink); }

    button.btn-primary {
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: var(--radius);
      font-family: var(--f-sans);
      font-size: 16px;
      font-weight: 600;
      height: 56px;
      padding: 0 12px;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button.btn-primary:active   { opacity: 0.8; }
    button.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .error-msg { color: var(--alert); font-size: 13px; }
    .hidden    { display: none !important; }

    /* ── SUCCESS / INSTALL ── */
    #success-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .install-check {
      color: var(--done);
      font-size: 40px;
      line-height: 1;
    }
    .install-title {
      font-family: var(--f-display);
      font-weight: 500;
      font-size: 32px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--done);
    }
    .install-subtitle {
      color: var(--mut);
      font-size: 13px;
    }
    .install-steps {
      display: flex;
      flex-direction: column;
      margin: 4px 0;
      border-top: 1px solid var(--rule);
    }
    .install-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--rule);
    }
    .step-num {
      background: var(--ink);
      color: var(--paper);
      font-size: 13px;
      font-weight: 600;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      min-width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-text {
      font-size: 15px;
      line-height: 1.45;
      color: var(--ink);
    }
    .step-text strong { font-weight: 600; }
    .install-skip {
      background: transparent;
      border: none;
      color: var(--mut);
      font-family: var(--f-sans);
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      padding: 4px;
      text-decoration: underline;
    }

    /* ── LOADING ── */
    #loading-block { color: var(--mut); font-size: 15px; }
    #invalid-block { color: var(--alert); font-size: 15px; line-height: 1.5; }

    #form-block {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
  </style>
</head>
<body>

  <!-- Banner navigateur -->
  <div id="browser-banner">
    <span id="banner-text"></span>
    <button id="btn-copy">Copier le lien</button>
  </div>

  <div class="card">
    <div class="card-logo">Mike Coach</div>

    <!-- Chargement -->
    <div id="loading-block">Vérification du lien…</div>

    <!-- Lien invalide / expiré -->
    <div id="invalid-block" class="hidden">
      Ce lien est invalide ou a expiré.<br>
      Contactez votre coach pour en recevoir un nouveau.
    </div>

    <!-- Formulaire -->
    <div id="form-block" class="hidden">
      <div class="card-title">Bienvenue !</div>
      <div class="card-sub">Choisissez votre mot de passe pour accéder à l'application.</div>
      <input type="password" id="pw1" placeholder="Mot de passe (min. 6 car.)" autocomplete="new-password" />
      <input type="password" id="pw2" placeholder="Confirmer le mot de passe"  autocomplete="new-password" />
      <p class="error-msg hidden" id="pw-err"></p>
      <button class="btn-primary" id="btn-save">Enregistrer et accéder à l'app</button>
    </div>

    <!-- Succès + guide installation -->
    <div id="success-block" class="hidden">
      <div class="install-check">✓</div>
      <div class="install-title">Mot de passe enregistré !</div>
      <div class="install-subtitle">Installez l'application sur votre écran d'accueil pour y accéder en un tap.</div>
      <div class="install-steps" id="install-steps"></div>
      <button class="btn-primary" id="btn-open-app">Accéder à l'application</button>
      <button class="install-skip" id="btn-skip">Passer cette étape</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    /* ── DÉTECTION DEVICE ── */
    const ua      = navigator.userAgent;
    const isIOS   = /iPhone|iPad|iPod/.test(ua);
    const isAnd   = /Android/.test(ua);
    const isSafari = /Safari/.test(ua) && !/Chrome|CriOS|FxiOS|OPiOS/.test(ua);
    const isChrome = /Chrome/.test(ua) && !/Edg\//.test(ua) && !/CriOS/.test(ua);

    /* ── BANNER NAVIGATEUR ── */
    (function() {
      const banner  = document.getElementById('browser-banner');
      const txt     = document.getElementById('banner-text');
      const btnCopy = document.getElementById('btn-copy');
      const url     = window.location.href;

      if (isIOS && !isSafari) {
        txt.textContent = 'Pour installer l\'app, ouvrez ce lien dans Safari.';
        banner.classList.add('visible');
      } else if (isAnd && !isChrome) {
        txt.textContent = 'Pour installer l\'app, ouvrez ce lien dans Chrome.';
        banner.classList.add('visible');
      }

      btnCopy.addEventListener('click', () => {
        navigator.clipboard.writeText(url).then(() => {
          btnCopy.textContent = 'Copié !';
          setTimeout(() => { btnCopy.textContent = 'Copier le lien'; }, 2000);
        });
      });
    })();

    /* ── GUIDE D'INSTALLATION ── */
    function renderInstallSteps() {
      const container = document.getElementById('install-steps');
      let steps;

      if (isIOS) {
        steps = [
          { t: 'Appuyez sur <strong>Partager</strong> (l\'icône carré avec une flèche vers le haut) en bas de Safari.' },
          { t: 'Faites défiler et appuyez sur <strong>« Sur l\'écran d\'accueil »</strong>.' },
          { t: 'Appuyez sur <strong>Ajouter</strong> en haut à droite.' },
        ];
      } else if (isAnd) {
        steps = [
          { t: 'Appuyez sur le menu <strong>⋮</strong> en haut à droite de Chrome.' },
          { t: 'Appuyez sur <strong>« Ajouter à l\'écran d\'accueil »</strong> ou <strong>« Installer l\'application »</strong>.' },
          { t: 'Confirmez en appuyant sur <strong>Installer</strong>.' },
        ];
      } else {
        steps = [
          { t: 'Ouvrez ce lien sur votre <strong>iPhone (Safari)</strong> ou <strong>Android (Chrome)</strong>.' },
          { t: 'Suivez les instructions pour l\'ajouter à votre écran d\'accueil.' },
        ];
      }

      container.innerHTML = steps.map((s, i) => `
        <div class="install-step">
          <div class="step-num">${i + 1}</div>
          <div class="step-text">${s.t}</div>
        </div>`).join('');
    }

    /* ── GESTION DU TOKEN SUPABASE ── */
    const loadingEl = document.getElementById('loading-block');
    const invalidEl = document.getElementById('invalid-block');
    const formEl    = document.getElementById('form-block');
    const successEl = document.getElementById('success-block');

    function showBlock(id) {
      [loadingEl, invalidEl, formEl, successEl].forEach(el => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    // Supabase v2 détecte automatiquement le hash de recovery
    db.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        showBlock('form-block');
      } else if (event === 'SIGNED_IN' && window.location.hash.includes('type=recovery')) {
        showBlock('form-block');
      }
    });

    // Timeout si aucun événement recovery n'arrive (lien invalide)
    setTimeout(() => {
      if (!formEl.classList.contains('hidden')) return;
      if (!successEl.classList.contains('hidden')) return;
      showBlock('invalid-block');
    }, 4000);

    // Vérifier la session au chargement (cas où l'event arrive avant le listener)
    db.auth.getSession().then(({ data: { session } }) => {
      const hash = window.location.hash;
      if (session && hash.includes('type=recovery')) {
        showBlock('form-block');
      }
    });

    /* ── ENREGISTREMENT DU MOT DE PASSE ── */
    document.getElementById('btn-save').addEventListener('click', async () => {
      const pw1   = document.getElementById('pw1').value;
      const pw2   = document.getElementById('pw2').value;
      const errEl = document.getElementById('pw-err');
      const btn   = document.getElementById('btn-save');
      errEl.classList.add('hidden');

      if (pw1.length < 6) {
        errEl.textContent = 'Le mot de passe doit faire au moins 6 caractères.';
        errEl.classList.remove('hidden');
        return;
      }
      if (pw1 !== pw2) {
        errEl.textContent = 'Les mots de passe ne correspondent pas.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enregistrement…';

      const { error } = await db.auth.updateUser({ password: pw1 });
      if (error) {
        errEl.textContent = error.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Enregistrer et accéder à l\'app';
        return;
      }

      // Marquer le profil comme "mot de passe créé"
      const { data: { user } } = await db.auth.getUser();
      if (user) await db.from('profiles').update({ state: 'password_created' }).eq('id', user.id);

      renderInstallSteps();
      showBlock('success-block');

      document.getElementById('btn-open-app').addEventListener('click', () => {
        window.location.href = '/';
      });
      document.getElementById('btn-skip').addEventListener('click', () => {
        window.location.href = '/';
      });
    });
  </script>
</body>
</html>
