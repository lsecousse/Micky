<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#EEEDE8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mike Coach" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500;1,6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dist/output.css" />
  <title>Mike Coach</title>
</head>
<body>

  <!-- LOADING SCREEN — image pré-rendue avec la vraie Fraunces -->
  <div id="loading-screen" class="!bg-a-ink">
    <div class="text-center px-6 w-full max-w-[420px]">
      <img src="icons/wordmark.png" alt="Mike Coach" class="w-full h-auto" />
      <p id="loading-sub" class="app-version font-sans text-[9px] uppercase tracking-eyebrow text-a-muted mt-6"></p>
    </div>
  </div>

  <div id="app">

    <!-- HOME -->
    <div id="screen-home" class="screen active bg-a-ink text-a-paper font-sans">
      <header class="relative flex items-center gap-3 px-5 pt-5 pb-4 border-b border-a-border shrink-0">
        <img src="icons/icon-192.png" class="w-10 h-10 object-contain shrink-0" alt="Mike Coach" />
        <div class="flex-1 min-w-0">
          <h1 class="font-display text-[22px] font-black italic leading-none tracking-tight text-a-paper">Mike Coach.</h1>
          <p class="app-version font-sans text-[9px] uppercase tracking-eyebrow text-a-muted mt-1.5"></p>
        </div>
        <button id="user-menu-btn" class="w-10 h-10 rounded-full border border-a-border flex items-center justify-center text-a-muted active:text-a-racing active:border-a-racing transition" aria-label="Menu utilisateur">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <div id="user-dropdown" class="hidden absolute right-5 top-[calc(100%-4px)] min-w-52 bg-a-inkAlt border border-a-border rounded shadow-[0_18px_40px_rgba(0,0,0,0.6)] z-50 overflow-hidden"></div>
      </header>

      <main id="home-main" class="flex-1 min-h-0 overflow-y-auto px-5 py-8 space-y-10"></main>

      <footer class="grid grid-cols-2 border-t border-a-border bg-a-ink/95 backdrop-blur-sm shrink-0">
        <button id="go-corps" class="py-4 px-4 text-center border-r border-a-border active:bg-a-inkAlt transition">
          <span class="font-sans text-[12px] font-medium uppercase tracking-[0.16em] text-a-paper leading-tight">Données corporelles</span>
        </button>
        <button id="go-alim" class="py-4 px-4 text-center active:bg-a-inkAlt transition">
          <span class="font-sans text-[12px] font-medium uppercase tracking-[0.16em] text-a-paper leading-tight">Alimentation</span>
        </button>
      </footer>
    </div>

    <!-- PROFIL -->
    <div id="screen-profil" class="screen">
      <header class="sticky top-0 z-10 bg-a-ink/96 backdrop-blur-sm border-b border-a-border px-5 py-4 flex items-center gap-4">
        <button id="back-profil" class="flex items-center gap-2 font-sans text-[11px] uppercase tracking-eyebrow text-a-paper active:text-a-acid transition">
          <span aria-hidden class="text-[18px] leading-none">←</span>
          <span>Retour</span>
        </button>
        <div class="font-display font-bold italic text-[15px] leading-tight text-a-paper">Profil</div>
      </header>
      <main id="screen-profil-body" class="flex-1 min-h-0 overflow-y-auto"></main>
    </div>

    <!-- CLÉ API CLAUDE -->
    <div id="screen-claude-api" class="screen">
      <header class="sticky top-0 z-10 bg-a-ink/96 backdrop-blur-sm border-b border-a-border px-5 py-4 flex items-center gap-4">
        <button id="back-claude-api" class="flex items-center gap-2 font-sans text-[11px] uppercase tracking-eyebrow text-a-paper active:text-a-acid transition">
          <span aria-hidden class="text-[18px] leading-none">←</span>
          <span>Retour</span>
        </button>
        <div class="font-display font-bold italic text-[15px] leading-tight text-a-paper">Clé API Claude</div>
      </header>
      <main id="screen-claude-api-body" class="flex-1 min-h-0 overflow-y-auto"></main>
    </div>

    <!-- COMPOSITION CORPORELLE -->
    <div id="screen-corps" class="screen">
      <header class="sticky top-0 z-10 bg-a-ink/96 backdrop-blur-sm border-b border-a-border px-5 py-4 flex items-center gap-4">
        <button id="back-corps" class="flex items-center gap-2 font-sans text-[11px] uppercase tracking-eyebrow text-a-paper active:text-a-acid transition">
          <span aria-hidden class="text-[18px] leading-none">←</span>
          <span>Retour</span>
        </button>
        <div class="font-display font-bold italic text-[15px] leading-tight text-a-paper">Corps</div>
      </header>
      <main id="screen-corps-body" class="flex-1 min-h-0 overflow-y-auto"></main>
    </div>

    <!-- À LA SALLE -->
    <div id="screen-seance" class="screen bg-a-ink text-a-paper font-sans">
      <header class="relative flex items-center gap-3 px-5 pt-5 pb-4 border-b border-a-border shrink-0">
        <button id="back-seance" class="w-10 h-10 -ml-2 flex items-center justify-center text-a-paper active:text-a-muted transition" aria-label="Retour">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <span class="font-display text-[18px] font-semibold tracking-tight text-a-paper">À la salle</span>
      </header>
      <div class="flex-1 min-h-0 overflow-y-auto" id="screen-seance-body"></div>
    </div>

    <!-- HISTORIQUE -->
    <div id="screen-history" class="screen">
      <header class="sticky top-0 z-10 bg-a-ink/96 backdrop-blur-sm border-b border-a-border px-5 py-4 flex items-center gap-4">
        <button id="back-history" class="flex items-center gap-2 font-sans text-[11px] uppercase tracking-eyebrow text-a-paper active:text-a-acid transition">
          <span aria-hidden class="text-[18px] leading-none">←</span>
          <span>Retour</span>
        </button>
        <div class="font-display font-bold italic text-[15px] leading-tight text-a-paper">Historique</div>
      </header>
      <main id="history-list" class="flex-1 min-h-0 overflow-y-auto"></main>
    </div>

    <!-- STATS -->
    <div id="screen-stats" class="screen">
      <header class="sticky top-0 z-10 bg-a-ink/96 backdrop-blur-sm border-b border-a-border px-5 py-4 flex items-center gap-4">
        <button id="back-stats" class="flex items-center gap-2 font-sans text-[11px] uppercase tracking-eyebrow text-a-paper active:text-a-acid transition">
          <span aria-hidden class="text-[18px] leading-none">←</span>
          <span>Retour</span>
        </button>
        <div class="font-display font-bold italic text-[15px] leading-tight text-a-paper">Stats</div>
      </header>
      <main id="screen-stats-body" class="flex-1 min-h-0 overflow-y-auto"></main>
    </div>

    <!-- ALIMENTATION -->
    <div id="screen-alim" class="screen">
      <header class="sticky top-0 z-10 bg-a-ink/96 backdrop-blur-sm border-b border-a-border px-5 py-4 flex items-center gap-4">
        <button id="back-alim" class="flex items-center gap-2 font-sans text-[11px] uppercase tracking-eyebrow text-a-paper active:text-a-acid transition">
          <span aria-hidden class="text-[18px] leading-none">←</span>
          <span>Retour</span>
        </button>
        <div class="font-display font-bold italic text-[15px] leading-tight text-a-paper">Alimentation</div>
      </header>
      <main id="screen-alim-body" class="flex-1 min-h-0 overflow-y-auto"></main>
    </div>

    <!-- PARAMÈTRES -->
    <div id="screen-params" class="screen">
      <header class="sticky top-0 z-10 bg-a-ink/96 backdrop-blur-sm border-b border-a-border px-5 py-4 flex items-center gap-4">
        <button id="back-params" class="flex items-center gap-2 font-sans text-[11px] uppercase tracking-eyebrow text-a-paper active:text-a-acid transition">
          <span aria-hidden class="text-[18px] leading-none">←</span>
          <span>Retour</span>
        </button>
        <div class="font-display font-bold italic text-[15px] leading-tight text-a-paper">Programmes</div>
      </header>
      <main id="screen-params-body" class="flex-1 min-h-0 overflow-y-auto"></main>
    </div>

    <!-- LOGIN -->
    <div id="screen-login" class="screen">
      <div class="flex-1 flex flex-col justify-center px-6 pt-[env(safe-area-inset-top)]">
        <!-- Masthead -->
        <section class="pb-9 accent-line">
          <h1 class="font-display font-black h-display text-a-paper">
            Mike<br/>
            <span class="text-a-paper/40"><span class="text-a-acid not-italic font-black">·</span> Coach.</span>
          </h1>
        </section>

        <!-- Form -->
        <div id="login-form" class="mt-12 space-y-4">
          <div>
            <p class="font-sans text-[9px] uppercase tracking-[0.40em] text-a-muted mb-1.5">Email</p>
            <input type="email" id="login-email" autocomplete="email" inputmode="email"
              class="w-full bg-transparent border-b border-a-border focus:border-a-acid font-sans text-[16px] text-a-paper py-2 outline-none transition" />
          </div>
          <div>
            <p class="font-sans text-[9px] uppercase tracking-[0.40em] text-a-muted mb-1.5">Mot de passe</p>
            <input type="password" id="login-password" autocomplete="current-password"
              class="w-full bg-transparent border-b border-a-border focus:border-a-acid font-sans text-[16px] text-a-paper py-2 outline-none transition" />
          </div>
          <p id="login-error" class="hidden font-sans text-[11px] text-a-blood mt-2"></p>
          <button id="btn-login" class="w-full mt-6 py-4 bg-a-acid text-a-ink font-display font-bold text-[14px] uppercase tracking-eyebrow active:bg-a-acid/80 transition">
            Se connecter →
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- CHRONO FULLSCREEN -->
  <div id="chrono-overlay" class="hidden fixed inset-0 z-[200] bg-a-ink flex flex-col items-center justify-center px-6 text-center">
    <p class="font-sans text-[10px] uppercase tracking-[0.40em] text-a-racing font-semibold mb-3 flex items-center gap-2">
      <span aria-hidden class="w-1.5 h-1.5 bg-a-racing animate-pulse"></span>
      Chrono en cours
    </p>
    <p id="chrono-exercise-name" class="font-display font-bold italic text-[16px] text-a-paper mb-10 max-w-[28ch]"></p>
    <div class="font-display font-black num-stat text-a-racing leading-none tracking-tight" style="font-size:clamp(4rem, 22vw, 7rem)">
      <span id="chrono-display">00:00</span>
    </div>
    <button id="chrono-stop" class="mt-12 py-4 px-10 bg-a-blood text-a-paper font-display font-bold text-[14px] uppercase tracking-eyebrow active:bg-a-blood/80 transition">Stop</button>
  </div>

  <!-- MINUTERIE FULLSCREEN -->
  <div id="minuterie-overlay" class="hidden fixed inset-0 z-[200] bg-a-ink flex flex-col items-center justify-center px-6 text-center">
    <p class="font-sans text-[10px] uppercase tracking-[0.40em] text-a-racing font-semibold mb-3 flex items-center gap-2">
      <span aria-hidden class="w-1.5 h-1.5 bg-a-racing animate-pulse"></span>
      Minuterie
    </p>
    <p id="minuterie-exercise-name" class="font-display font-bold italic text-[16px] text-a-paper mb-10 max-w-[28ch]"></p>
    <div class="font-display font-black num-stat text-a-racing leading-none tracking-tight" style="font-size:clamp(4rem, 22vw, 7rem)">
      <span id="minuterie-display">00:00</span>
    </div>
    <button id="minuterie-stop" class="mt-12 py-4 px-10 bg-a-blood text-a-paper font-display font-bold text-[14px] uppercase tracking-eyebrow active:bg-a-blood/80 transition">Stop</button>
  </div>


  <!-- COUNTDOWN STICKY TOP BAR -->
  <div id="countdown-bar" class="hidden">
    <div class="countdown-info">
      <p class="countdown-head"><span class="countdown-label">Repos</span> <span id="countdown-exercise-name" class="overlay-exercise-name"></span></p>
      <span id="countdown-display">00:00</span>
      <!-- Linear progress: same dash mechanics as the former ring (length 264 = RING_CIRCUMFERENCE) -->
      <svg class="countdown-ring" viewBox="0 0 264 4" preserveAspectRatio="none" aria-hidden="true">
        <line class="ring-bg" x1="0" y1="2" x2="264" y2="2" />
        <line id="ring-progress" class="ring-progress" x1="0" y1="2" x2="264" y2="2" />
      </svg>
    </div>
    <button id="countdown-skip" title="Passer le repos" aria-label="Passer le repos">⏭</button>
  </div>

  <!-- TOAST -->
  <div id="toast" class="hidden"></div>

  <!-- DIALOG CUSTOM -->
  <div id="dialog" class="dialog hidden">
    <div class="bg-sheet border-[1.5px] border-solid border-ink rounded p-6 max-w-[360px] w-full space-y-6">
      <p id="dialog-msg" class="font-display italic font-medium text-[20px] text-ink leading-snug"></p>
      <div class="flex gap-3">
        <button id="dialog-cancel" class="flex-1 h-14 border-[1.5px] border-solid border-ink rounded text-ink font-sans text-[16px] font-semibold active:bg-ink/10 transition">Annuler</button>
        <button id="dialog-ok" class="flex-1 h-14 bg-ink text-paper rounded font-sans text-[16px] font-semibold active:bg-ink/80 transition">OK</button>
      </div>
    </div>
  </div>

  <!-- MODAL DÉTAIL SÉANCE -->
  <div id="modal" class="modal hidden">
    <div class="modal-content !bg-a-ink !p-0 !rounded-t-none border-t border-a-border">
      <button class="modal-close !bg-a-inkAlt !border !border-a-border !text-a-paper !rounded-none" id="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- MODAL ÉDITION ACTIVITÉ (live) -->
  <div id="live-edit-modal" class="live-edit-modal hidden">
    <div class="live-edit-modal-overlay !bg-a-ink/80"></div>
    <div class="!relative !bg-a-ink !border !border-a-border !rounded-none !p-6 !max-w-[380px] !w-full mx-4 space-y-5" style="background:var(--a-ink);max-height:90vh;overflow-y:auto">
      <p class="font-sans text-[9px] uppercase tracking-[0.40em] text-a-acid font-semibold">Modifier</p>
      <h2 id="live-edit-modal-title" class="font-display font-bold italic text-[20px] leading-tight text-a-paper">Activité</h2>
      <div id="live-edit-modal-body" class="space-y-4"></div>
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button id="live-edit-modal-cancel" class="py-3 border border-a-border text-a-paper font-sans text-[11px] uppercase tracking-eyebrow active:border-a-paper transition">Annuler</button>
        <button id="live-edit-modal-ok" class="py-3 bg-a-acid text-a-ink font-display font-bold text-[12px] uppercase tracking-eyebrow active:bg-a-acid/80 transition">Valider</button>
      </div>
    </div>
  </div>

  <!-- MODAL AJOUTER REPAS -->
  <div id="add-meal-modal" class="live-edit-modal hidden">
    <div class="live-edit-modal-overlay !bg-a-ink/80"></div>
    <div class="!relative !bg-a-ink !border !border-a-border !rounded-none !p-6 !max-w-[400px] !w-full mx-4 space-y-5" style="background:var(--a-ink);max-height:90vh;overflow-y:auto">
      <div>
        <p class="font-sans text-[9px] uppercase tracking-[0.40em] text-a-acid font-semibold mb-2">Repas</p>
        <h2 class="font-display font-bold italic text-[20px] leading-tight text-a-paper">Ajouter</h2>
      </div>
      <div>
        <p class="font-sans text-[9px] uppercase tracking-[0.40em] text-a-muted mb-1.5">Description</p>
        <textarea id="meal-text" placeholder="3 weetabix, miel, banane…" rows="3"
          class="w-full bg-transparent border border-a-border focus:border-a-acid font-sans text-[14px] text-a-paper p-3 outline-none transition resize-y"></textarea>
      </div>
      <input type="file" id="meal-photo" accept="image/*" capture="environment" class="hidden" />
      <button type="button" id="meal-photo-btn" class="w-full py-3 border border-a-border text-a-paper font-sans text-[11px] uppercase tracking-eyebrow active:border-a-acid active:text-a-acid transition">📸 Joindre une photo</button>
      <div id="meal-photo-preview" class="hidden text-center"></div>
      <p id="meal-error" class="hidden font-sans text-[11px] text-a-blood"></p>
      <div class="grid grid-cols-2 gap-3">
        <button id="meal-cancel" class="py-3 border border-a-border text-a-paper font-sans text-[11px] uppercase tracking-eyebrow active:border-a-paper transition">Annuler</button>
        <button id="meal-save" class="py-3 bg-a-acid text-a-ink font-display font-bold text-[12px] uppercase tracking-eyebrow active:bg-a-acid/80 transition">Estimer →</button>
      </div>
    </div>
  </div>

  <!-- MODAL PRESET PETIT-DEJ -->
  <div id="meal-preset-modal" class="live-edit-modal hidden">
    <div class="live-edit-modal-overlay !bg-a-ink/80"></div>
    <div class="!relative !bg-a-ink !border !border-a-border !rounded-none !p-6 !max-w-[400px] !w-full mx-4 space-y-5" style="background:var(--a-ink)">
      <div>
        <p class="font-sans text-[9px] uppercase tracking-[0.40em] text-a-acid font-semibold mb-2">Preset</p>
        <h2 id="meal-preset-title" class="font-display font-bold italic text-[20px] leading-tight text-a-paper">Définir petit-dej</h2>
      </div>
      <div>
        <p class="font-sans text-[9px] uppercase tracking-[0.40em] text-a-muted mb-1.5">Description</p>
        <textarea id="meal-preset-text" placeholder="3 weetabix, miel, banane…" rows="3"
          class="w-full bg-transparent border border-a-border focus:border-a-acid font-sans text-[14px] text-a-paper p-3 outline-none transition resize-y"></textarea>
      </div>
      <p id="meal-preset-error" class="hidden font-sans text-[11px] text-a-blood"></p>
      <div class="grid grid-cols-2 gap-3">
        <button id="meal-preset-cancel" class="py-3 border border-a-border text-a-paper font-sans text-[11px] uppercase tracking-eyebrow active:border-a-paper transition">Annuler</button>
        <button id="meal-preset-save" class="py-3 bg-a-acid text-a-ink font-display font-bold text-[12px] uppercase tracking-eyebrow active:bg-a-acid/80 transition">Estimer →</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/escape-html.js"></script>
  <script src="lib/exercise-name.js"></script>
  <script src="lib/recompose-session.js"></script>
  <script src="lib/planned-series.js"></script>
  <script src="lib/prefill-series.js"></script>
  <script src="lib/live-resume.js"></script>
  <script src="lib/watch-sync.js"></script>
  <script src="supabase.js"></script>
  <script src="exercise-editor.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
