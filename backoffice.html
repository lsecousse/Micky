<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mike Coach — Backoffice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500;1,6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Carnet */
      --paper: #EEEDE8;
      --sheet: #F7F6F2;
      --ink:   #1B1C1F;
      --mut:   #6F6C64;
      --rule:  #D6D3C9;
      --hl:    #FFE45C;
      --done:  #1E6B4A;
      --alert: #A8321F;
      --f-display: "Newsreader", ui-serif, Georgia, serif;
      --f-sans:    "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --f-mono:    "IBM Plex Mono", ui-monospace, "Courier New", monospace;
      --veil: rgba(27,28,31,.4);

      /* Former back-office names, mapped onto Carnet (the programme editor still uses them) */
      --bg:       var(--paper);
      --surface:  var(--sheet);
      --surface2: var(--paper);
      --accent:   var(--ink);
      --text:     var(--ink);
      --muted:    var(--mut);
      --danger:   var(--alert);
      --border:   var(--rule);
      --font:     var(--f-sans);
      --font-display: var(--f-display);
      --radius:   6px;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--f-sans);
      font-size: 14px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LOGIN ── */
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-box {
      background: var(--sheet);
      border: 1.5px solid var(--ink);
      border-radius: var(--radius);
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .login-box h1 {
      color: var(--ink);
      font-family: var(--f-display);
      font-style: italic;
      font-weight: 700;
      font-size: 32px;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .login-box p.sub { color: var(--mut); font-size: 13px; margin-bottom: 12px; }

    /* ── LAYOUT ── */
    .bo-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* ── SIDEBAR (client column) ── */
    .bo-sidebar {
      background: var(--sheet);
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 0;
    }
    .bo-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 64px;
      padding: 0 20px;
      border-bottom: 1.5px solid var(--ink);
    }
    .bo-logo { color: var(--ink); font-family: var(--f-display); font-style: italic; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
    .bo-clients { flex: 1; overflow-y: auto; padding: 0 0 16px; }
    .bo-client-item {
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--rule);
      transition: background 0.15s;
    }
    .bo-client-item:hover { background: var(--paper); }
    .bo-client-item.active { background: var(--hl); }
    .bo-client-name {
      color: var(--ink);
      font-family: var(--f-display);
      font-style: italic;
      font-weight: 700;
      font-size: 17px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .bo-client-email { color: var(--mut); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
    .bo-client-item.active .bo-client-email { color: var(--ink); }
    .bo-empty { color: var(--mut); font-size: 13px; line-height: 1.5; padding: 20px; }
    .bo-sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--rule); }

    /* ── FAB (nouveau client) ── */
    .bo-fab {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 70;
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      background: var(--ink);
      color: var(--paper);
      font-family: var(--f-sans);
      font-size: 24px;
      font-weight: 400;
      line-height: 1;
      padding: 0;
      border: 1.5px solid var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bo-fab:hover { background: var(--paper); color: var(--ink); }

    /* ── MAIN PANEL ── */
    .bo-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .bo-main-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mut);
      font-family: var(--f-display);
      font-style: italic;
      font-size: 22px;
    }
    .bo-detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .bo-detail-header {
      padding: 20px 88px 0 32px;
      border-bottom: 1.5px solid var(--ink);
    }
    .bo-detail-title {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px 14px;
      flex-wrap: wrap;
    }
    .bo-detail-name {
      color: var(--ink);
      font-family: var(--f-display);
      font-weight: 500;
      font-size: 36px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    .bo-detail-email { color: var(--mut); font-size: 13px; overflow-wrap: anywhere; }
    .bo-state {
      font-family: var(--f-sans);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      padding: 4px 8px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .bo-state--new              { background: transparent; color: var(--mut);   border-color: var(--rule); }
    .bo-state--invited          { background: transparent; color: var(--ink);   border-color: var(--ink); }
    .bo-state--password_created { background: var(--ink);  color: var(--paper); border-color: var(--ink); }
    .bo-state--connected        { background: transparent; color: var(--done);  border-color: var(--done); }

    /* Status icon in the client list: colour only */
    .bo-state-dot {
      font-family: var(--f-sans);
      font-style: normal;
      font-size: 12px;
      font-weight: normal;
      background: none;
      border: 0;
      padding: 0;
      margin-left: 2px;
    }
    .bo-state-dot.bo-state--password_created { color: var(--ink); background: none; }

    .bo-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .bo-stat-card {
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 16px;
    }
    .bo-stat-value { font-family: var(--f-mono); font-size: 28px; font-weight: 500; color: var(--ink); }
    .bo-stat-unit { font-size: 14px; font-weight: normal; color: var(--mut); margin-left: 2px; }
    .bo-stat-label { font-size: 13px; color: var(--mut); margin-top: 4px; }
    .bo-stat-footer { margin-top: 16px; font-size: 13px; color: var(--mut); }

    /* Shared bits of the client screens */
    .bo-note { color: var(--mut); font-size: 14px; line-height: 1.6; }
    .bo-strong { color: var(--ink); font-weight: 600; }
    .bo-num { font-family: var(--f-mono); font-weight: 500; font-feature-settings: "tnum", "lnum"; }

    .bo-compact-section { margin-bottom: 20px; }
    .bo-id-row {
      display: flex;
      align-items: center;
      gap: 6px 10px;
      flex-wrap: wrap;
      padding: 12px 0;
      border-top: 1.5px solid var(--ink);
      border-bottom: 1px solid var(--rule);
      font-size: 14px;
      color: var(--ink);
    }
    .bo-id-tag { display: inline-flex; align-items: center; gap: 6px; }
    .bo-id-tag + .bo-id-tag::before { content: '·'; color: var(--mut); margin-right: 4px; }
    .bo-id-label { color: var(--mut); font-size: 12px; }
    .bo-id-row input[type=number] { font-family: var(--f-mono); }
    .bo-save-msg { font-size: 13px; color: var(--mut); }

    .bo-tabs { display: flex; gap: 28px; margin-bottom: -1.5px; }
    .bo-tab {
      padding: 10px 0 9px;
      border: 0;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--mut);
      font-family: var(--f-sans);
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
    }
    .bo-tab:hover { color: var(--ink); }
    .bo-tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
    .bo-detail-body { flex: 1; overflow-y: auto; padding: 28px 32px; }

    /* ── PROGRAMME LIST ── */
    .prog-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 880px;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
    }
    .prog-row:first-of-type { border-top: 1.5px solid var(--ink); }
    .prog-row-name { color: var(--ink); font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 19px; line-height: 1.2; }
    .prog-row-count { color: var(--mut); font-size: 13px; margin-top: 3px; }
    .prog-row-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* ── PROGRAMME EDITOR ── */
    .bo-editor { display: flex; flex-direction: column; gap: 12px; }
    /* Lot 6 strict minimum: the editor's Direction A light text (lot C repaints it) stays readable on paper */
    .bo-editor .text-a-paper { color: var(--ink); }
    .bo-editor .pz-card { background-color: var(--sheet); }
    .bo-editor-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
    .exercise-block {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .exercise-block-header {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .exercise-block-fields {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .exercise-block-fields label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── SESSIONS VIEW ── */
    .session-row {
      max-width: 880px;
      padding: 12px 0;
      border-bottom: 1px solid var(--rule);
    }
    .session-row:first-of-type { border-top: 1.5px solid var(--ink); }
    .session-row-header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .session-prog { color: var(--ink); font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 18px; line-height: 1.2; }
    .session-date { color: var(--mut); font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
    .session-meta { color: var(--mut); font-size: 13px; margin-top: 3px; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: var(--veil);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      padding: 24px;
    }
    .modal {
      background: var(--sheet);
      color: var(--ink);
      border: 1.5px solid var(--ink);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal h2 {
      font-family: var(--f-display);
      font-style: italic;
      font-weight: 500;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .bo-confirm-msg { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 20px; line-height: 1.3; }
    .bo-confirm-note { display: block; margin-top: 8px; color: var(--alert); font-family: var(--f-sans); font-style: normal; font-size: 13px; line-height: 1.5; }
    .bo-success-mark { color: var(--done); font-family: var(--f-mono); font-size: 32px; font-weight: 600; line-height: 1; }
    .bo-copy-email { color: var(--mut); font-size: 12px; font-weight: 400; margin-left: 4px; }

    /* ── INPUTS ── */
    input[type=text], input[type=email], input[type=password], input[type=number], textarea {
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--f-sans);
      font-size: 14px;
      padding: 9px 12px;
      width: 100%;
      outline: none;
    }
    /* body prefix: outranks the @tailwindcss/forms rules loaded later in dist/output.css */
    body input::placeholder, body textarea::placeholder { color: var(--mut); }
    body input:focus, body textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    textarea { resize: vertical; min-height: 48px; }

    /* ── BUTTONS — Carnet ── */
    button {
      cursor: pointer;
      font-family: var(--f-sans);
      border: none;
      border-radius: var(--radius);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary, .btn-secondary, .btn-danger, .btn-ghost {
      font-family: var(--f-sans);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      padding: 10px 18px;
      border: 1.5px solid transparent;
      border-radius: var(--radius);
      text-underline-offset: 4px;
    }
    .btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .btn-secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
    .btn-danger { background: transparent; color: var(--alert); }
    .btn-ghost { background: transparent; color: var(--mut); font-weight: 500; }
    .btn-primary:hover:not(:disabled), .btn-secondary:hover:not(:disabled),
    .btn-danger:hover:not(:disabled) { text-decoration: underline; }
    .btn-ghost:hover:not(:disabled) { color: var(--ink); text-decoration: underline; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-full { width: 100%; }

    /* ── UTILS ── */
    .error-msg { color: var(--alert); font-size: 13px; line-height: 1.4; }
    .section-title { color: var(--mut); font-size: 13px; margin-bottom: 6px; margin-top: 8px; }
    .hidden { display: none !important; }
    .flex-row { display: flex; gap: 8px; align-items: center; }
    .spacer { flex: 1; }

    /* ── EXERCISE CARD (exercise-editor.js) ── */
    .exercise-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .exercise-name-row { display: flex; gap: 6px; align-items: center; }
    .exercise-name { flex: 1; }
    .exercise-move-btn { font-size: 16px; padding: 2px 6px; min-width: 28px; }
    .exercise-sets-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .exercise-sets { width: 56px !important; text-align: center; }
    .activities-list-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .activities-list { display: flex; flex-direction: column; gap: 6px; }
    .exercise-comment { font-size: 12px; }

    .activity-row { display: flex; flex-direction: column; gap: 6px; background: var(--surface2); border-radius: 8px; padding: 8px; }
    .activity-row-top { display: flex; align-items: center; gap: 6px; }
    .activity-row-bottom { display: flex; align-items: center; gap: 6px; padding-left: 4px; }
    .activity-type-btn {
      font-size: 10px; padding: 3px 8px; background: none;
      border: 1px solid var(--border); color: var(--muted);
      border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .activity-name { flex: 1; min-width: 0; font-size: 13px; }
    .activity-fields { display: flex; align-items: center; gap: 4px; }
    .activity-fields input { width: 52px !important; text-align: center; }
    .activity-sep { font-size: 11px; color: var(--muted); }
    .activity-rest { width: 44px !important; text-align: center; font-size: 12px; }
    .activity-remove-btn {
      background: none; border: none; color: var(--muted);
      font-size: 18px; line-height: 1; padding: 0 2px; margin-left: auto;
    }
    .activity-remove-btn:hover { color: var(--danger); }

    /* ── STATS (progression tab) ── */
    .stats-section { margin: 28px 0 14px; max-width: 1200px; }
    .stats-section-title {
      color: var(--ink);
      font-family: var(--f-display);
      font-style: italic;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }

    .stats-prog-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .stats-prog-pill {
      padding: 5px 12px; border-radius: var(--radius); font-size: 13px;
      background: transparent; border: 1px solid var(--rule);
      color: var(--mut); cursor: pointer; font-family: var(--f-sans);
      transition: color 0.15s, border-color 0.15s;
    }
    .stats-prog-pill:hover { color: var(--ink); border-color: var(--ink); }
    .stats-prog-pill.active { color: var(--ink); border-color: var(--ink); font-weight: 600; }

    .stats-metric-toggle {
      display: flex; gap: 28px; margin-bottom: 18px;
      border-bottom: 1px solid var(--rule);
    }
    .stats-metric-btn {
      padding: 8px 0 7px; font-size: 14px;
      background: transparent; color: var(--mut); border: 0;
      border-bottom: 3px solid transparent; border-radius: 0; margin-bottom: -1px;
      cursor: pointer; font-family: var(--f-sans);
      transition: color 0.15s, border-color 0.15s;
    }
    .stats-metric-btn:hover { color: var(--ink); }
    .stats-metric-btn.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }

    .stats-cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px; margin-bottom: 22px;
    }
    .stats-exo-card {
      background: var(--sheet); border: 1px solid var(--rule);
      border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
    }
    .stats-exo-name {
      color: var(--ink); font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 17px;
      line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .stats-exo-values { display: flex; align-items: baseline; gap: 8px; font-family: var(--f-mono); font-size: 14px; font-feature-settings: "tnum", "lnum"; }
    .stats-exo-start { color: var(--mut); }
    .stats-exo-arrow { color: var(--mut); font-size: 13px; }
    .stats-exo-end { color: var(--ink); font-weight: 600; }
    .stats-exo-delta { font-size: 13px; margin-left: auto; font-weight: 600; }
    .stats-exo-delta.up { color: var(--done); }
    .stats-exo-delta.down { color: var(--alert); }
    .stats-exo-delta.neutral { color: var(--mut); }

    .stats-chart-wrap { position: relative; width: 100%; height: 300px; margin-bottom: 8px; }
    .stats-no-data { font-size: 13px; color: var(--mut); text-align: center; padding: 20px 0; }

    /* ── RESPONSIVE: sidebar toggle button (hidden on desktop) ── */
    .bo-sidebar-toggle {
      display: none;
      position: fixed;
      top: 12px; left: 12px;
      z-index: 60;
      width: 40px; height: 40px;
      border-radius: var(--radius);
      background: var(--sheet);
      border: 1.5px solid var(--ink);
      color: var(--ink);
      font-size: 20px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: var(--f-sans);
      padding: 0;
    }
    .bo-sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: var(--veil);
      z-index: 49;
    }

    /* ── TABLET (≤ 1024px) ── */
    @media (max-width: 1024px) {
      .bo-layout { grid-template-columns: 240px minmax(0, 1fr); }
      .bo-detail-header { padding: 16px 80px 0 16px; }
      .bo-detail-body { padding: 16px; }
      .bo-stat-value { font-size: 22px; }
      .bo-stats-grid { gap: 8px; }
      .bo-tabs { gap: 20px; }
      .bo-detail-name { font-size: 30px; }
      .exercise-block-header { grid-template-columns: 1fr auto; }
      .exercise-block-fields { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── MOBILE (≤ 768px) ── */
    @media (max-width: 768px) {
      .bo-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }
      .bo-sidebar {
        position: fixed;
        inset: 0;
        z-index: 50;
        width: 280px;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      .bo-sidebar.open {
        transform: translateX(0);
      }
      .bo-sidebar-overlay.open {
        display: block;
      }
      .bo-sidebar-toggle {
        display: flex;
      }
      .bo-main {
        min-height: 100vh;
      }
      .bo-main-placeholder {
        padding-top: 60px;
      }
      .bo-detail-header {
        padding: 60px 14px 0;
      }
